<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ornakuy · Dashboard Poster</title>
<style>
  :root { --bg:#0d0d10; --card:#17171b; --card2:#1e1e24; --line:#2b2b33; --text:#ededf2; --muted:#9696a2; --chrome:#d9dae0; --ok:#3ecf8e; --warn:#f5b04c; --accent:#ff5fa2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  button, input, textarea { font:inherit; color:inherit; }
  header { position:sticky; top:0; z-index:5; background:rgba(13,13,16,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:16px 28px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:baseline; gap:10px; }
  .brand b { font-size:20px; letter-spacing:.12em; }
  .brand span { color:var(--muted); font-size:14px; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; color:var(--muted); }
  .pill b { color:var(--text); }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tabs { display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .tabs button { background:none; border:0; padding:7px 12px; border-radius:7px; cursor:pointer; color:var(--muted); font-size:13px; }
  .tabs button.on { background:var(--card2); color:var(--text); }
  input[type=search] { background:var(--card); border:1px solid var(--line); padding:9px 12px; border-radius:10px; width:190px; font-size:13px; }
  .iconbtn { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; font-size:13px; }
  .banner { margin:16px 28px 0; padding:12px 16px; border:1px solid #5a4520; background:#2a2111; color:#f3d39b; border-radius:12px; font-size:14px; display:none; }
  main { padding:20px 28px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; outline:none; }
  .card.active { border-color:#6b6b78; box-shadow:0 0 0 1px #6b6b78; }
  .card.done { border-color:#245c43; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:14px 16px 10px; }
  .code { font-weight:900; font-size:22px; letter-spacing:.08em; }
  .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .badge { font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--warn); white-space:nowrap; }
  .badge.ok { color:var(--ok); border-color:#245c43; }
  .photos { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:0 16px; }
  .ph { position:relative; background:#26262d; border-radius:10px; overflow:hidden; aspect-ratio:3/4; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph span { position:absolute; left:6px; top:6px; font-size:11px; background:rgba(0,0,0,.6); padding:2px 7px; border-radius:6px; }
  .steps { padding:12px 16px 0; display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .btn { background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:9px 6px; cursor:pointer; font-size:12.5px; text-align:center; }
  .btn:hover { border-color:#55555f; }
  .btn.primary { background:var(--chrome); color:#111; border-color:var(--chrome); font-weight:600; }
  .btn small { display:block; color:var(--muted); font-size:10.5px; margin-bottom:2px; }
  .btn.primary small { color:#444; }
  .drop { margin:10px 16px 16px; border:1.5px dashed #3a3a44; border-radius:12px; padding:14px; text-align:center; font-size:13px; color:var(--muted); cursor:pointer; transition:.15s; }
  .drop:hover, .drop.over { border-color:var(--chrome); color:var(--text); background:#1c1c22; }
  .drop.busy { color:var(--warn); }
  .drop a { color:var(--ok); }
  .result { display:flex; gap:10px; align-items:center; margin:10px 16px 16px; padding:10px; background:#11241b; border:1px solid #245c43; border-radius:12px; font-size:13px; }
  .result a { color:var(--ok); }
  .result button { margin-left:auto; background:none; border:1px solid #245c43; color:var(--muted); border-radius:8px; padding:5px 8px; cursor:pointer; font-size:12px; }
  .empty { color:var(--muted); padding:40px 0; grid-column:1/-1; text-align:center; }
  dialog { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:16px; width:min(640px,94vw); padding:22px; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  dialog h2 { margin:0 0 4px; font-size:18px; }
  dialog p { color:var(--muted); font-size:13px; margin:0 0 16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; }
  dialog input, dialog textarea { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:13px; }
  dialog textarea { min-height:190px; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#26262e; border:1px solid var(--line); padding:11px 18px; border-radius:12px; font-size:14px; opacity:0; transition:.2s; pointer-events:none; z-index:20; }
  .toast.show { opacity:1; }
  .zoom { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:15; align-items:center; justify-content:center; }
  .zoom img { max-width:92vw; max-height:92vh; border-radius:12px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>ORNAKUY</b><span>Dashboard Poster</span></div>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <div class="tabs" id="tabs">
      <button data-f="todo" class="on">Belum</button>
      <button data-f="done">Selesai</button>
      <button data-f="all">Semua</button>
    </div>
    <input type="search" id="q" placeholder="Cari kode…" autocomplete="off">
    <button class="iconbtn" id="refresh" title="Muat ulang">↻</button>
    <button class="iconbtn" id="openSettings">⚙ Pengaturan</button>
  </div>
</header>
<div class="banner" id="banner">Drive belum tersambung. Buka <b>⚙ Pengaturan</b> lalu isi URL Apps Script dan PIN supaya hasil bisa tersimpan ke Google Drive.</div>
<main id="grid"><div class="empty">Memuat pesanan…</div></main>

<dialog id="settings">
  <h2>Pengaturan</h2>
  <p>Disimpan di browser ini saja.</p>
  <label>URL Apps Script (Web app URL)</label>
  <input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec">
  <label>PIN Drive (sama dengan PIN di Apps Script)</label>
  <input id="sPin" type="password">
  <label>Link ChatGPT (Project kamu, atau biarkan chatgpt.com)</label>
  <input id="sGpt" placeholder="https://chatgpt.com/">
  <label>Prompt — {CODE} dan {SPELLED} otomatis diganti</label>
  <textarea id="sPrompt"></textarea>
  <div class="row">
    <button class="iconbtn" id="resetPrompt">Prompt bawaan</button>
    <button class="iconbtn" id="closeSettings">Batal</button>
    <button class="btn primary" id="saveSettings" style="padding:9px 16px">Simpan</button>
  </div>
</dialog>
<div class="zoom" id="zoom"><img id="zoomImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
const DEFAULT_PROMPT = `The attached image is a sheet with 3 labeled panels:
- Panel A (STYLE REFERENCE) = the finished poster style I want. Copy its look and layout.
- Panel B (FRONT) and Panel C (BACK) = photos of the Roblox avatar outfit I am selling (the product).

Create ONE vertical 2:3 poster of the avatar in Panel B/C, made EXACTLY in the style of Panel A.

LOCKED FROM PANEL A (do not change):
- Background: same light grey studio, same liquid silver chrome swirls, same glossy reflective dark floor, same colors and lighting. Do not recolor or redesign the background.
- Title: same font, same size, same position and same layout at the top center - a four-point star, the word "CODE", the code, then a four-point star - in the same black color. Replace only the code with "{CODE}". Spell it exactly: {SPELLED}. No other text anywhere.
- Placement: same composition as Panel A - FRONT view on the left, BACK view on the right, large full-body figures, same scale, same camera angle, standing on the reflective floor.

LOCKED FROM PANEL B/C (do not change):
- The outfit and the avatar must match the photos exactly: same colors and shades of every clothing piece, skin tone, hair color, prints, graphics, patterns, rips, accessories, shoes and shapes. Do not recolor, simplify, redesign or add anything.
- Never take the outfit, hair, skin or character from Panel A - Panel A is only for style and layout.

SPECIAL RULES:
- If the face is covered by the clothing (hood, mask, helmet, etc.), that is the design of the outfit. Keep it covered. Do NOT generate or reveal a face.
- If the avatar wears a hood, hoodie, hat or beanie and the hair visibly clips through it in the photo, fix only that: keep the hair inside / under the hood so nothing pokes through.
- If the hair does NOT clip through, do not regenerate, restyle or "improve" the hair or the hood at all - keep their shapes exactly as in the photo.
- Do not add the panel labels or white borders to the poster.`;

const store = {
  get(k, d) { try { const v = localStorage.getItem('ornakuy_' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ornakuy_' + k, v); } catch (e) {} }
};
const cfg = () => ({ url: store.get('url', '').trim(), pin: store.get('pin', ''), gpt: store.get('gpt', '') || 'https://chatgpt.com/', prompt: store.get('prompt', '') || DEFAULT_PROMPT });

let orders = [], done = {}, todayName = '', filter = 'todo', activeCode = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, ms = 2200) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function fmt(t) { try { return new Date(t).toLocaleString('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); } catch (e) { return ''; } }

async function drive(body) {
  const c = cfg();
  if (!c.url || !c.pin) throw new Error('Drive belum diatur');
  const r = await fetch(c.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ key: c.pin, ...body }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Gagal');
  return j;
}

async function loadAll() {
  try {
    orders = await (await fetch('orders.json?' + Date.now())).json();
  } catch (e) { orders = []; }
  const c = cfg();
  $('banner').style.display = (c.url && c.pin) ? 'none' : 'block';
  if (c.url && c.pin) {
    try { const j = await drive({ action:'list' }); done = j.done || {}; todayName = j.today || ''; }
    catch (e) { toast('Drive: ' + e.message, 3500); }
  }
  render();
}

function render() {
  const q = $('q').value.trim().toUpperCase();
  const isDone = o => !!done[o.code];
  const todayCount = Object.values(done).filter(d => d.folder === todayName).length;
  $('stats').innerHTML =
    `<span class="pill">Belum <b>${orders.filter(o => !isDone(o)).length}</b></span>` +
    `<span class="pill">Selesai <b>${orders.filter(isDone).length}</b></span>` +
    (todayName ? `<span class="pill">Drive ${esc(todayName)}: <b>${todayCount}</b></span>` : '');
  const list = orders.filter(o => (filter === 'all' || (filter === 'done') === isDone(o)) && (!q || o.code.includes(q)));
  if (!list.length) { $('grid').innerHTML = `<div class="empty">${filter === 'todo' ? 'Semua pesanan sudah selesai 🎉' : 'Tidak ada pesanan.'}</div>`; return; }
  $('grid').innerHTML = list.map(o => {
    const d = done[o.code];
    return `
    <div class="card ${d ? 'done' : ''} ${activeCode === o.code ? 'active' : ''}" data-code="${esc(o.code)}" tabindex="0">
      <div class="top">
        <div><div class="code">${esc(o.code)}</div><div class="meta">${esc(o.author)} · ${fmt(o.time)}</div></div>
        <span class="badge ${d ? 'ok' : ''}">${d ? '✓ Selesai' : 'Belum'}</span>
      </div>
      <div class="photos">
        <div class="ph"><img src="${esc(o.front)}" loading="lazy" data-zoom alt="depan"><span>Depan</span></div>
        <div class="ph"><img src="${esc(o.back)}" loading="lazy" data-zoom alt="belakang"><span>Belakang</span></div>
      </div>
      <div class="steps">
        <button class="btn primary" data-act="photo"><small>Langkah 1</small>Salin foto</button>
        <button class="btn primary" data-act="prompt"><small>Langkah 2</small>Salin prompt</button>
        <button class="btn" data-act="gpt"><small>Langkah 3</small>Buka ChatGPT ↗</button>
      </div>
      ${d ? `<div class="result">✓ Tersimpan di <a href="${esc(d.url)}" target="_blank" rel="noopener">Drive · ${esc(d.folder)}</a><button data-act="redo">Ganti</button></div>`
          : `<div class="drop" data-act="upload"><b>Langkah 4</b> · Upload hasil ChatGPT ke Drive<br><span style="font-size:12px">klik, seret gambar ke sini, atau pilih kartu lalu Ctrl+V</span></div>`}
    </div>`;
  }).join('');
}

function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function combinedBlob(o) {
  const imgs = await Promise.all([loadImg('reference.jpg'), loadImg(o.front), loadImg(o.back)]);
  const labels = ['A  STYLE REFERENCE', 'B  FRONT', 'C  BACK'];
  const H = 1200, gap = 24, top = 70;
  const ws = imgs.map(i => Math.round(i.naturalWidth * H / i.naturalHeight));
  const c = document.createElement('canvas');
  c.width = ws.reduce((p, q) => p + q, 0) + gap * 4; c.height = H + top + gap;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#111'; x.font = 'bold 40px Arial, sans-serif'; x.textBaseline = 'middle';
  let px = gap;
  imgs.forEach((im, i) => { x.fillText(labels[i], px, top / 2 + 6); x.drawImage(im, px, top, ws[i], H); px += ws[i] + gap; });
  return new Promise(r => c.toBlob(r, 'image/png'));
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const promptFor = code => cfg().prompt.replaceAll('{CODE}', code).replaceAll('{SPELLED}', code.split('').join('-'));

async function act(kind, o, cardEl) {
  if (kind === 'photo') {
    try {
      const blob = await combinedBlob(o);
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      toast('Referensi + foto depan + belakang tersalin. Tempel (Ctrl+V) di ChatGPT');
    } catch (e) {
      try { download(await combinedBlob(o), o.code + '_depan-belakang.png'); toast('Foto diunduh — seret ke ChatGPT'); }
      catch (e2) { toast('Gagal menyiapkan foto'); }
    }
  } else if (kind === 'prompt') {
    try { await navigator.clipboard.writeText(promptFor(o.code)); toast('Prompt ' + o.code + ' tersalin. Tempel (Ctrl+V) di ChatGPT'); }
    catch (e) { toast('Gagal menyalin prompt'); }
  } else if (kind === 'gpt') {
    window.open(cfg().gpt, 'ornakuy_chatgpt');
  } else if (kind === 'upload' || kind === 'redo') {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => inp.files[0] && upload(o, inp.files[0]);
    inp.click();
  }
}

async function upload(o, file) {
  if (!file || !file.type.startsWith('image/')) { toast('Itu bukan gambar'); return; }
  const c = cfg();
  if (!c.url || !c.pin) { toast('Atur Drive dulu di ⚙ Pengaturan', 3000); $('openSettings').click(); return; }
  const card = document.querySelector(`.card[data-code="${o.code}"] .drop`);
  if (card) { card.classList.add('busy'); card.textContent = 'Mengupload ke Drive…'; }
  try {
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
    const j = await drive({ action:'upload', code:o.code, mime:file.type, data });
    done[o.code] = { url:j.url, folder:j.folder, t:Date.now() }; todayName = j.folder;
    toast(`✓ ${o.code} tersimpan di Drive · ${j.folder}`, 3000);
    render();
  } catch (e) {
    toast('Upload gagal: ' + e.message, 4000); render();
  }
}

$('grid').addEventListener('click', e => {
  const cardEl = e.target.closest('.card'); if (!cardEl) return;
  const o = orders.find(x => x.code === cardEl.dataset.code);
  activeCode = o.code;
  document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active')); cardEl.classList.add('active');
  if (e.target.matches('img[data-zoom]')) { $('zoomImg').src = e.target.src; $('zoom').style.display = 'flex'; return; }
  const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, o, cardEl);
});
$('grid').addEventListener('dragover', e => { const d = e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
$('grid').addEventListener('dragleave', e => { const d = e.target.closest('.drop'); if (d) d.classList.remove('over'); });
$('grid').addEventListener('drop', e => {
  const d = e.target.closest('.drop'); if (!d) return; e.preventDefault();
  const o = orders.find(x => x.code === d.closest('.card').dataset.code);
  upload(o, e.dataTransfer.files[0]);
});
document.addEventListener('paste', e => {
  if (!activeCode || e.target.closest('dialog')) return;
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if (f) { e.preventDefault(); upload(orders.find(x => x.code === activeCode), f); }
});
$('zoom').onclick = () => $('zoom').style.display = 'none';
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); render(); };
$('q').oninput = render;
$('refresh').onclick = () => { toast('Memuat ulang…', 1000); loadAll(); };
$('openSettings').onclick = () => { const c = cfg(); $('sUrl').value = c.url; $('sPin').value = c.pin; $('sGpt').value = store.get('gpt', ''); $('sPrompt').value = c.prompt; $('settings').showModal(); };
$('closeSettings').onclick = () => $('settings').close();
$('resetPrompt').onclick = () => { $('sPrompt').value = DEFAULT_PROMPT; };
$('saveSettings').onclick = () => {
  store.set('url', $('sUrl').value.trim()); store.set('pin', $('sPin').value);
  store.set('gpt', $('sGpt').value.trim());
  store.set('prompt', $('sPrompt').value.trim() === DEFAULT_PROMPT.trim() ? '' : $('sPrompt').value);
  $('settings').close(); toast('Tersimpan'); loadAll();
};
loadAll();
setInterval(loadAll, 120000);
</script>
</body>
</html>
