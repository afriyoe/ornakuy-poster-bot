<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORNA KUY - Poster Bot</title>
<style>
  :root { --bg:#0d0d10; --card:#17171b; --card2:#1e1e24; --line:#2b2b33; --text:#ededf2; --muted:#9696a2; --chrome:#d9dae0; --ok:#3ecf8e; --warn:#f5b04c; --info:#7aa7ff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  button, input, textarea { font:inherit; color:inherit; }
  header { position:sticky; top:0; z-index:5; background:rgba(13,13,16,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 28px; }
  .row1 { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:baseline; gap:10px; }
  .brand b { font-size:20px; letter-spacing:.12em; }
  .brand span { color:var(--muted); font-size:14px; }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pull { background:var(--chrome); color:#111; border:0; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; font-size:14px; }
  .pull:disabled { opacity:.6; cursor:wait; }
  .runstat { font-size:12px; color:var(--muted); }
  .runstat b { color:var(--text); font-weight:600; }
  .iconbtn { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px; cursor:pointer; font-size:13px; }
  .row2 { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-top:12px; }
  .tabs { display:flex; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px; gap:2px; }
  .tabs button { background:none; border:0; padding:8px 14px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:13.5px; display:flex; gap:7px; align-items:center; }
  .tabs button.on { background:var(--card2); color:var(--text); }
  .tabs .n { background:#2a2a32; border-radius:999px; padding:1px 8px; font-size:12px; color:var(--text); }
  .tabs button[data-f=new] .n { background:#3a2c12; color:var(--warn); }
  input[type=search] { background:var(--card); border:1px solid var(--line); padding:9px 12px; border-radius:10px; width:200px; font-size:13px; }
  .banner { margin:16px 28px 0; padding:12px 16px; border:1px solid #5a4520; background:#2a2111; color:#f3d39b; border-radius:12px; font-size:14px; display:none; }
  .hint { margin:14px 28px 0; color:var(--muted); font-size:13px; }
  main { padding:16px 28px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .card.active { border-color:#6b6b78; box-shadow:0 0 0 1px #6b6b78; }
  .card.done { border-color:#245c43; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; padding:14px 16px 10px; gap:8px; }
  .code { font-weight:900; font-size:22px; letter-spacing:.08em; }
  .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .badges { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .badge { font-size:11.5px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--warn); white-space:nowrap; }
  .badge.ok { color:var(--ok); border-color:#245c43; }
  .badge.rep { color:var(--info); border-color:#2c3e66; }
  .photos { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:0 16px; }
  .photos.three { grid-template-columns:1fr 1fr 1fr; }
  .ph { position:relative; background:#26262d; border-radius:10px; overflow:hidden; aspect-ratio:3/4; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  .ph span { position:absolute; left:6px; top:6px; font-size:11px; background:rgba(0,0,0,.65); padding:2px 7px; border-radius:6px; }
  .ph.res span { background:#11412c; }
  .steps { padding:12px 16px 0; display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .btn { background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:9px 6px; cursor:pointer; font-size:12.5px; text-align:center; text-decoration:none; color:var(--text); }
  .btn:hover { border-color:#55555f; }
  .btn.primary { background:var(--chrome); color:#111; border-color:var(--chrome); font-weight:600; }
  .btn small { display:block; color:var(--muted); font-size:10.5px; margin-bottom:2px; }
  .btn.primary small { color:#444; }
  .btn.drive { background:#11241b; border-color:#245c43; color:var(--ok); }
  .drop { margin:10px 16px 16px; border:1.5px dashed #3a3a44; border-radius:12px; padding:13px; text-align:center; font-size:13px; color:var(--muted); cursor:pointer; transition:.15s; }
  .drop:hover, .drop.over { border-color:var(--chrome); color:var(--text); background:#1c1c22; }
  .drop.busy { color:var(--warn); }
  .drop .pastebtn { margin-top:9px; padding:7px 14px; font-size:12.5px; }
  .result { display:flex; gap:8px; align-items:center; margin:10px 16px 16px; flex-wrap:wrap; }
  .result .btn { flex:1; }
  .day { margin:26px 0 12px; display:flex; align-items:center; gap:12px; }
  .day:first-child { margin-top:4px; }
  .day h3 { margin:0; font-size:16px; }
  .day .cnt { color:var(--muted); font-size:13px; }
  .day .btn { margin-left:auto; padding:7px 12px; }
  .day .btn + .btn { margin-left:0; }
  .gal { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
  .gcard { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .gcard .img { aspect-ratio:2/3; background:#222; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; }
  .gcard img { width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  .gcard .foot { padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .gcard .foot b { letter-spacing:.06em; }
  .gcard .foot .btn { padding:6px 10px; font-size:12px; }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  dialog { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:16px; width:min(660px,94vw); padding:22px; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  dialog h2 { margin:0 0 4px; font-size:18px; }
  dialog p { color:var(--muted); font-size:13px; margin:0 0 16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; }
  dialog input, dialog textarea { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:13px; }
  dialog textarea { min-height:220px; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .drow { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#26262e; border:1px solid var(--line); padding:11px 18px; border-radius:12px; font-size:14px; opacity:0; transition:.2s; pointer-events:none; z-index:20; max-width:90vw; }
  .toast.show { opacity:1; }
  .zoom { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:15; align-items:center; justify-content:center; }
  .zoom img { max-width:92vw; max-height:92vh; border-radius:12px; }
  .steps.one { grid-template-columns:1fr; }
  .btn.big { padding:12px; font-size:15px; }
  .mini { display:flex; gap:6px; padding:8px 16px 0; }
  .mini button { flex:1; background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:6px; font-size:11.5px; cursor:pointer; }
  .mini button:hover { color:var(--text); }
  .gcard .img.vid { aspect-ratio:9/16; position:relative; }
  .vcard { cursor:pointer; }
  .play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:58px; height:58px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; pointer-events:none; }
  .vname { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:58%; }
  .cnt.low { color:var(--warn); }
  .when { color:var(--info); font-weight:600; }
  .day.tomorrow h3 .when { color:var(--ok); }
  .vbox { width:min(460px,92vw); display:flex; flex-direction:column; gap:10px; }
  .dlall { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 6px; }
  .dlall .btn { padding:9px 14px; }
  .dlall .muted { color:var(--muted); font-size:12.5px; }
  .gcard { position:relative; }
  .gcard.got .img::after { content:'✓ diunduh'; position:absolute; top:8px; left:8px; background:rgba(16,120,70,.9); color:#fff; font-size:11px; font-weight:600; padding:3px 7px; border-radius:999px; pointer-events:none; }
  .gcard .img { position:relative; }
  .gcard .foot .icbtn { width:30px; height:30px; background:var(--card2); color:var(--text); border:1px solid var(--line); }
  .gcard .foot .icbtn.got { color:var(--ok); border-color:var(--ok); }
  @media (max-width:640px) {
    main { padding:12px 12px 60px; }
    .hint { margin:12px 12px 0; }
    .tabs { overflow-x:auto; flex-wrap:nowrap; max-width:100%; }
    .tabs button { white-space:nowrap; flex:0 0 auto; }
    .grid { grid-template-columns:1fr; }
    .gal { grid-template-columns:1fr 1fr; gap:8px; }
    .gcard { border-radius:10px; }
    .gcard .foot { padding:7px 8px; }
    .gcard .foot b { font-size:12px; letter-spacing:.03em; }
    .gcard .foot .btn { padding:4px 7px; font-size:11px; }
    .day { flex-wrap:wrap; gap:8px; margin:20px 0 10px; }
    .day h3 { font-size:15px; }
  }
  .vbox iframe { width:100%; aspect-ratio:9/16; max-height:82vh; border:0; border-radius:12px; background:#000; }
  .vbar { display:flex; gap:8px; justify-content:center; }
  .vbar .btn { padding:9px 16px; }
  .zbox { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .zoom .zbox img { max-height:84vh; }
  .icbtn { width:42px; height:42px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:var(--chrome); color:#111; border:0; cursor:pointer; font-size:16px; text-decoration:none; }
  .icbtn:hover { filter:brightness(1.1); }
  .icbtn.got { background:var(--ok); color:#fff; }
  .postbar { display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; margin-bottom:6px; }
  .postbar .days, .postbar .links { display:flex; gap:6px; flex-wrap:wrap; }
  .iconbtn.on { background:var(--chrome); color:#111; }
  .prows { display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
  .prow { display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; }
  .pthumb { position:relative; width:72px; aspect-ratio:9/16; border-radius:10px; overflow:hidden; background:#222; flex:none; cursor:pointer; }
  .pthumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .pthumb .play { width:34px; height:34px; font-size:14px; }
  .pinfo { flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .pinfo .vname { max-width:100%; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--card2); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:5px 11px; font-size:12px; cursor:pointer; }
  .chip.terjadwal { color:var(--warn); border-color:#5a4520; background:#2a2111; }
  .chip.terposting { color:var(--ok); border-color:#245c43; background:#11241b; }
  .gcard[data-slide] { cursor:pointer; }
  .gcard.sel { border-color:var(--chrome); box-shadow:0 0 0 2px var(--chrome); }
  .tick { position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,.6); border:2px solid #fff; color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .gcard .img { position:relative; }
</style>
</head>
<body>
<header>
  <div class="row1">
    <div class="brand"><b>ORNA KUY</b><span>- Poster Bot</span></div>
    <div class="actions">
      <span class="runstat" id="runstat"></span>
      <button class="pull" id="pull">⬇ Tarik dari Discord</button>
      <button class="iconbtn" id="refresh" title="Muat ulang">↻</button>
      <button class="iconbtn" id="openSettings">⚙ Pengaturan</button>
    </div>
  </div>
  <div class="row2">
    <div class="tabs" id="tabs">
      <button data-f="new" class="on">Baru <span class="n" id="nNew">0</span></button>
      <button data-f="seen">Pernah di-generate <span class="n" id="nSeen">0</span></button>
      <button data-f="results">Hasil generate <span class="n" id="nRes">0</span></button>
      <button data-f="videos">Video Konten <span class="n" id="nVid">0</span></button>
      <button data-f="post">Jadwal Posting</button>
    </div>
    <input type="search" id="q" placeholder="Cari kode…" autocomplete="off">
  </div>
</header>
<div class="banner" id="banner">Drive belum tersambung. Buka <b>⚙ Pengaturan</b> lalu isi URL Apps Script dan PIN supaya bisa upload ke Drive dan memakai tombol Tarik.</div>
<div class="hint" id="hint"></div>
<main id="main"><div class="empty">Memuat…</div></main>

<dialog id="settings">
  <h2>Pengaturan</h2>
  <p>Disimpan di browser ini saja.</p>
  <label>URL Apps Script (Web app URL)</label>
  <input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec">
  <label>PIN (sama dengan PIN di Apps Script)</label>
  <input id="sPin" type="password">
  <label>Link ChatGPT (Project kamu, atau biarkan chatgpt.com)</label>
  <input id="sGpt" placeholder="https://chatgpt.com/">
  <label>Nama akun, pisahkan koma (akun terakhir = Instagram)</label>
  <input id="sAcc" placeholder="TikTok 1, TikTok 2, Instagram">
  <label>Jam posting video, pisahkan koma</label>
  <input id="sTimes" placeholder="12:00, 17:00, 20:00">
  <label>Caption video ({TANGGAL} otomatis)</label>
  <textarea id="sCapV" style="min-height:90px"></textarea>
  <label>Caption slide foto ({KODE} = daftar kode terpilih)</label>
  <textarea id="sCapS" style="min-height:90px"></textarea>
  <label>Prompt — {CODE} dan {SPELLED} otomatis diganti</label>
  <textarea id="sPrompt"></textarea>
  <div class="drow">
    <button class="iconbtn" id="resetPrompt">Prompt bawaan</button>
    <button class="iconbtn" id="closeSettings">Batal</button>
    <button class="btn primary" id="saveSettings" style="padding:9px 16px">Simpan</button>
  </div>
</dialog>
<div class="zoom" id="zoom"><div class="zbox"><img id="zoomImg" alt=""><div class="vbar"><button class="icbtn" id="zdl" title="Download"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></button><button class="icbtn" id="zclose" title="Tutup">✕</button></div></div></div>
<div class="zoom" id="vzoom"><div class="vbox"><iframe id="vframe" allow="autoplay; fullscreen" allowfullscreen></iframe><div class="vbar"><a id="vdl" class="icbtn" title="Download" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></a><a id="vopen" class="btn drive" target="_blank" rel="noopener">Buka di Drive ↗</a><button class="btn" id="vclose">Tutup</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const REPO = 'afriyoe/ornakuy-poster-bot';
const RAW = `https://raw.githubusercontent.com/${REPO}/main/`;
const DEFAULT_PROMPT = `The attached image is a sheet with 3 labeled panels:
- Panel A (STYLE REFERENCE) = the finished poster style I want. Copy its look and layout.
- Panel B (FRONT) and Panel C (BACK) = photos of the Roblox avatar outfit I am selling (the product).

Create ONE vertical 2:3 poster of the avatar in Panel B/C, made EXACTLY in the style of Panel A.

LOCKED FROM PANEL A (do not change):
- Background: same light grey studio, same liquid silver chrome swirls, same glossy reflective dark floor, same colors and lighting. Do not recolor or redesign the background.
- Title: same font, same size, same position and same layout at the top center - a four-point star, the word "CODE", the code, then a four-point star - in the same black color. Replace only the code with "{CODE}". Spell it exactly: {SPELLED}. No other text anywhere.
- Placement: same composition as Panel A - FRONT view on the left, BACK view on the right, large full-body figures, same scale, standing on the reflective floor.
- Camera: slightly LOW angle (camera around knee height, looking slightly up), like a high-end streetwear lookbook shot, so the figures look tall, confident and cool and the shoes look big in the foreground.
- Pose: confident cool streetwear model pose, relaxed shoulders, slight head tilt. {POSE} Changing the pose is allowed, but the clothes must stay identical.

LOCKED FROM PANEL B/C (do not change):
- The outfit and the avatar must match the photos exactly: same colors and shades of every clothing piece, skin tone, hair color, prints, graphics, patterns, rips, accessories, shoes and shapes. Do not recolor, simplify, redesign or add anything.
- Never take the outfit, hair, skin or character from Panel A - Panel A is only for style and layout.

SPECIAL RULES:
- FACE: copy the avatar's face exactly as in Panel B (same eyes, eye color, eyebrows, mouth, makeup/face decals, skin tone), clearly visible and not hidden by the hair. Never leave the face blank and never replace it with a different face.
- Only if the face in Panel B is truly covered by clothing (mask, helmet, closed hood) keep it covered exactly like that - do not reveal or invent a face under it.
- If the avatar wears a hood, hoodie, hat or beanie and the hair visibly clips through it in the photo, fix only that: keep the hair inside / under the hood so nothing pokes through.
- If the hair does NOT clip through, do not regenerate, restyle or "improve" the hair or the hood at all - keep their shapes exactly as in the photo.
- Do not add the panel labels or white borders to the poster.`;

const store = {
  get(k, d) { try { const v = localStorage.getItem('ornakuy_' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ornakuy_' + k, v); } catch (e) {} }
};
const DEF_CAPV = 'Outfit Roblox Streetwear 3d Unique\ncommunity store: ORNA KUY\noutfit idea avatar cowok cewek y2k ugc kalcer couple zepeto starboy luna\n#avaroblox #roblox #robloxoutfits #robloxavatar';
const DEF_CAPS = DEF_CAPV;
const cfg = () => ({ url: store.get('url', '').trim(), pin: store.get('pin', ''), gpt: store.get('gpt', '') || 'https://chatgpt.com/', prompt: store.get('prompt', '') || DEFAULT_PROMPT,
  acc: store.get('acc', '') || 'TikTok 1, TikTok 2, Instagram', times: store.get('times', '') || '12:00, 17:00, 20:00', capV: store.get('capV', '') || DEF_CAPV, capS: store.get('capS', '') || DEF_CAPS });

let videoGroups = null;
let plan = {};
let zoomMeta = { id:null, name:'gambar' };
let orders = [], driveDone = {}, driveFiles = [], legacy = [], todayName = '', rootUrl = '', tab = 'new', activeId = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, ms = 2400) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function fmt(t) { try { return new Date(t).toLocaleString('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); } catch (e) { return ''; } }
const raw = p => RAW + p;
const thumb = id => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w800`;

async function drive(body) {
  const c = cfg();
  if (!c.url || !c.pin) throw new Error('Drive belum diatur di ⚙ Pengaturan');
  const r = await fetch(c.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ key: c.pin, ...body }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Gagal');
  return j;
}

async function ghJson(path) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=main&t=${Date.now()}`, { cache:'no-store' });
  if (!r.ok) throw new Error('GitHub ' + r.status);
  const j = await r.json();
  const bytes = Uint8Array.from(atob(j.content.replace(/\n/g, '')), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function loadJson(path) {
  try { return await ghJson(path); }
  catch (e) { try { return await (await fetch(path + '?' + Date.now())).json(); } catch (e2) { return null; } }
}

// Hasil yang sudah ada: Drive (utama) + poster lama di GitHub (output/)
function resultFor(code) {
  if (driveDone[code]) return { src:'drive', ...driveDone[code] };
  const l = legacy.find(x => x.code === code);
  return l ? { src:'github', code, folder:'Lama (GitHub)', file:l.file } : null;
}

async function loadAll() {
  const [o, l] = await Promise.all([loadJson('orders.json'), loadJson('data.json')]);
  orders = o || []; legacy = (l || []).filter(x => x && x.code && x.file);
  const c = cfg();
  $('banner').style.display = (c.url && c.pin) ? 'none' : 'block';
  if (c.url && c.pin) {
    try { const j = await drive({ action:'list' }); driveDone = j.done || {}; driveFiles = j.files || []; todayName = j.today || ''; rootUrl = j.rootUrl || ''; }
    catch (e) { toast('Drive: ' + e.message, 3500); }
    drive({ action:'plan_get' }).then(j => { plan = j.plan || {}; if (tab === 'post') render(); }).catch(() => {});
    drive({ action:'videos' }).then(v => { videoGroups = v.groups || []; render(); }).catch(e => { videoGroups = []; if (tab === 'videos') toast('Video: ' + e.message, 4000); render(); });

function hydrateDrive() {

const BULAN_ID = { jan:0, feb:1, mar:2, apr:3, mei:4, may:4, jun:5, jul:6, agu:7, ags:7, aug:7, sep:8, okt:9, oct:9, nov:10, des:11, dec:11 };
function parseFolderDate(name) {
  const m = String(name || '').trim().toLowerCase().match(/^(\d{1,2})\s+([a-z]+)\.?(?:\s+(\d{4}))?/);
  if (!m) return null;
  const mon = BULAN_ID[m[2].slice(0, 3)]; if (mon === undefined) return null;
  const now = new Date(); const y = m[3] ? +m[3] : now.getFullYear();
  let d = new Date(y, mon, +m[1]);
  if (!m[3] && d - now > 200 * 864e5) d = new Date(y - 1, mon, +m[1]);
  if (!m[3] && now - d > 200 * 864e5) d = new Date(y + 1, mon, +m[1]);
  return d;
}
function dayDiff(d) { const a = new Date(); a.setHours(0,0,0,0); const b = new Date(d); b.setHours(0,0,0,0); return Math.round((b - a) / 864e5); }

let vidReady = null; // { folder, files:[{id, file}] } siap disimpan ke galeri
let vidBusy = null;  // folder yang sedang disiapkan
const isVideo = f => (f.mime || '').startsWith('video/');
const canShareVideo = () => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'], { type:'video/mp4' })], 'a.mp4', { type:'video/mp4' })] })); } catch (e) { return false; } };
function vidBtn(g) {

// Ambil beberapa video sekaligus: dipotong per 6 MB, 4 potongan diambil bersamaan (≈4x lebih cepat)
async function fetchVideos(list) {
  const CH = 6 * 1024 * 1024, POOL = 4;
  const vs = list.map(f => ({ ...f }));
  for (const f of vs) if (!f.size) { const j = await drive({ action:'chunk', id:f.id, start:0, size:1 }); f.size = j.total; }
  const tasks = []; vs.forEach((f, vi) => { for (let s = 0; s < f.size; s += CH) tasks.push({ vi, f, s }); });
  const parts = vs.map(() => []); const all = vs.reduce((a, f) => a + f.size, 0) || 1;
  let got = 0, next = 0;
  const one = async t => {
    for (let k = 0; ; k++) {
      try { return await drive({ action:'chunk', id:t.f.id, start:t.s, size:CH }); }
      catch (e) { if (k >= 2 || /chunk|aksi/i.test(e.message)) throw e; await new Promise(r => setTimeout(r, 1500)); }
    }
  };
  const worker = async () => {
    while (next < tasks.length) {
      const t = tasks[next++];
      const j = await one(t);
      const bin = atob(j.data); const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      parts[t.vi][t.s / CH] = u; if (j.mime) t.f.mime = j.mime;
      got += u.length;
      toast(`Mengambil ${vs.length} video · ${Math.min(100, Math.round(got / all * 100))}%`, 60000);
    }
  };
  await Promise.all(Array.from({ length: Math.min(POOL, tasks.length) }, worker));
  return vs.map((f, vi) => ({ id: f.id, file: new File(parts[vi], f.name, { type: f.mime || 'video/mp4' }) }));
}
async function downloadFolder(folder, onlyId) {
  const g = (videoGroups || []).find(x => x.folder === folder);
  const vids = g ? g.files.filter(f => isVideo(f) && (!onlyId || f.id === onlyId)) : [];
  if (!vids.length) { toast('Belum ada video di folder ini'); return; }
  if (canShareVideo()) {
    let todo = onlyId ? vids : vids.filter(f => !gotDl(f.id));
    if (!todo.length) todo = vids; // semua sudah pernah diunduh → unduh ulang
    vidReady = null; vidBusy = folder; render();
    let files = [];
    try {
      toast(`Mengambil ${todo.length} video…`, 60000);
      files = await fetchVideos(todo);
    } catch (e) {
      toast(/chunk|action|aksi/i.test(e.message) ? 'Apps Script belum diperbarui (aksi "chunk"). Lihat petunjuk update.' : 'Gagal ambil video: ' + e.message, 6000);
    }
    vidBusy = null;
    if (files.length) { vidReady = { folder, files }; toast(`${files.length} video siap — tekan "💾 Simpan ke Galeri"`, 5000); }
    render(); return;
  }
  toast(`Mengunduh ${vids.length} video dari ${folder}… (kalau Chrome bertanya, pilih "Izinkan" download beberapa file)`, 7000);
  for (const f of vids) {
    const fr = document.createElement('iframe');
    fr.style.display = 'none';
    fr.src = `https://drive.google.com/uc?export=download&id=${encodeURIComponent(f.id)}`;
    document.body.appendChild(fr);
    setTimeout(() => fr.remove(), 120000);
    await new Promise(r => setTimeout(r, 1500));
  }
}
async function saveVideos() {
  const r = vidReady; if (!r) return;
  vidReady = null;
  try {
    await navigator.share({ files: r.files.map(x => x.file) });
    markDl(r.files.map(x => x.id)); toast(`✓ ${r.files.length} video disimpan`, 3000);
  } catch (err) {
    if (err.name === 'AbortError') { vidReady = r; toast('Dibatalkan — tekan "Simpan ke Galeri" lagi kalau mau'); }
    else { for (const x of r.files) { download(x.file, x.file.name); await new Promise(res => setTimeout(res, 600)); } markDl(r.files.map(x => x.id)); }
  }

}

// ---- Auto-crop screenshot Roblox ke avatar (latar langit + lantai abu-abu) ----
function avatarBox(img) {
  const SW = 200, SH = Math.round(img.naturalHeight * SW / img.naturalWidth);
  const c = document.createElement('canvas'); c.width = SW; c.height = SH;
  const x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, SW, SH);
  const d = x.getImageData(0, 0, SW, SH).data;
  const mask = new Uint8Array(SW * SH);
  // Contoh warna latar diambil dari tepi paling luar (2–10% & 90–98%), supaya kain/rambut yang menjuntai
  // ke samping tidak ikut dianggap latar. Piksel = avatar kalau warnanya jauh dari SEMUA contoh latar di baris itu
  // (tahan terhadap tekstur lantai: bata terang & celah gelap sama-sama ada di contoh).
  const bgCols = []; for (let i = Math.floor(SW * .02); i < Math.floor(SW * .10); i++) bgCols.push(i); for (let i = Math.floor(SW * .90); i < Math.floor(SW * .98); i++) bgCols.push(i);
  const THR = 48;
  for (let y = Math.floor(SH * .12); y < Math.floor(SH * .97); y++) { // abaikan bar status / tombol menu di atas
    const S = [];
    for (let yy = Math.max(0, y - 3); yy <= Math.min(SH - 1, y + 3); yy += 3) for (const i of bgCols) { const k = (yy * SW + i) * 4; S.push(d[k], d[k + 1], d[k + 2]); }
    for (let i = Math.floor(SW * .10); i < Math.floor(SW * .9); i++) {
      const k = (y * SW + i) * 4, r = d[k], g = d[k + 1], bl = d[k + 2];
      let near = false;
      for (let s = 0; s < S.length; s += 3) { if (Math.abs(r - S[s]) <= THR && Math.abs(g - S[s + 1]) <= THR && Math.abs(bl - S[s + 2]) <= THR) { near = true; break; } }
      if (!near) mask[y * SW + i] = 1;
    }
  }
  // gabungkan bagian yang berdekatan (dilasi 2px)
  const m2 = new Uint8Array(SW * SH);
  for (let y = 0; y < SH; y++) for (let i = 0; i < SW; i++) if (mask[y * SW + i]) for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const yy = y + dy, xx = i + dx; if (yy >= 0 && yy < SH && xx >= 0 && xx < SW) m2[yy * SW + xx] = 1; }
  const seen = new Uint8Array(SW * SH); let box = null; const cx0 = SW * .35, cx1 = SW * .65;
  for (let s0 = 0; s0 < SW * SH; s0++) {
    if (!m2[s0] || seen[s0]) continue;
    const st = [s0]; seen[s0] = 1; let n = 0, x0 = SW, x1 = 0, y0 = SH, y1 = 0;
    while (st.length) { const p = st.pop(); n++; const py = (p / SW) | 0, pxx = p % SW; if (pxx < x0) x0 = pxx; if (pxx > x1) x1 = pxx; if (py < y0) y0 = py; if (py > y1) y1 = py;
      for (const q of [p - 1, p + 1, p - SW, p + SW]) if (q >= 0 && q < SW * SH && m2[q] && !seen[q] && Math.abs((q % SW) - pxx) <= 1) { seen[q] = 1; st.push(q); } }
    if (n < SW * SH * 0.002 || x1 < cx0 || x0 > cx1) continue;
    box = box ? [Math.min(box[0], x0), Math.min(box[1], y0), Math.max(box[2], x1), Math.max(box[3], y1)] : [x0, y0, x1, y1];
  }
  const k = img.naturalWidth / SW;
  if (!box || (box[3] - box[1]) < SH * 0.08 || (box[2] - box[0]) > SW * 0.75) return null;
  return box.map(v => v * k);
}
function cropAvatar(img, aspect = 0.62) {
  const W = img.naturalWidth, H = img.naturalHeight;
  let b; try { b = avatarBox(img); } catch (e) { b = null; }
  if (!b) return img;
  const bw = b[2] - b[0], bh = b[3] - b[1];
  const fullPhone = H / W > 1.7; // screenshot HP penuh: ada tombol "Exit Freecam" di atas — jangan ikut ter-crop
  const top = fullPhone ? Math.max(b[1] - bh * 0.10, Math.min(b[1] - bh * 0.02, H * 0.09)) : b[1] - bh * 0.10, bot = b[3] + bh * 0.06;

  // crop dibuat lebih ramping — JANGAN memotong tinggi avatar (dulu kepala/kaki bisa terpotong).
  let ch = Math.min(bot - top, H), cw = Math.max(ch * aspect, half * 2 * 1.1);

  const c = document.createElement('canvas'); c.width = Math.round(cw); c.height = Math.round(ch);

}

async function blobFromSrc(src) {
  const r = await fetch(src); const b = await r.blob();
  if (!b.type.startsWith('image/')) throw new Error('bukan gambar');
  return new File([b], 'hasil.' + ((b.type.split('/')[1] || 'png').replace('jpeg', 'jpg')), { type: b.type });
}
async function imageFromPasteEvent(e) {
  const dt = e.clipboardData; if (!dt) return null;
  for (const it of [...(dt.items || [])]) { if (it.kind === 'file' && it.type.startsWith('image/')) { const f = it.getAsFile(); if (f) return f; } }
  const f = [...(dt.files || [])].find(x => x.type.startsWith('image/')); if (f) return f;
  const html = dt.getData('text/html') || '';
  const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  if (m) { try { return await blobFromSrc(m[1]); } catch (err) {} }
  return null;
}
async function imageFromClipboardApi() {
  if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('Browser ini tidak mendukung tombol tempel — pakai Ctrl+V / Cmd+V');
  const items = await navigator.clipboard.read();
  for (const it of items) {
    const t = it.types.find(x => x.startsWith('image/'));
    if (t) { const b = await it.getType(t); return new File([b], 'hasil.' + (t.split('/')[1] || 'png').replace('jpeg', 'jpg'), { type: t }); }
    if (it.types.includes('text/html')) {
      const html = await (await it.getType('text/html')).text();
      const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
      if (m) { try { return await blobFromSrc(m[1]); } catch (err) {} }
    }
  }
  return null;
}

});
document.addEventListener('paste', async e => {
  const tg = e.target instanceof Element ? e.target : document.body;
  if (tg.closest('dialog') || tg.matches('input, textarea, [contenteditable]')) return;
  const id = activeId || hoverId;
  const o = id && orders.find(x => x.message_id === id);
  e.preventDefault();
  const f = await imageFromPasteEvent(e);
  if (!f) { toast('Clipboard tidak berisi gambar. Di ChatGPT klik kanan gambar → "Salin gambar".', 5000); return; }
  if (!o) { toast('Klik dulu kartu pesanannya, lalu tempel lagi', 4000); return; }
  upload(o, f);
});
$('zoom').onclick = e => { if (e.target.id === 'zoom' || e.target.closest('#zclose')) $('zoom').style.display = 'none'; };
$('zdl').onclick = async e => {
  e.stopPropagation();
  try {
    let src = $('zoomImg').src;
    if (zoomMeta.id) { const j = await drive({ action:'image', id: zoomMeta.id }); src = `data:${j.mime};base64,${j.data}`; }
    const blob = await (await fetch(src)).blob();
    const ext = (blob.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
    download(blob, `${zoomMeta.name}.${ext}`);
  } catch (err) { toast('Download gagal: ' + err.message, 4000); }
};
$('vclose').onclick = () => { $('vzoom').style.display = 'none'; $('vframe').src = 'about:blank'; };
$('vzoom').onclick = e => { if (e.target.id === 'vzoom') $('vclose').click(); };
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.f; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); render(); };
$('q').oninput = render;
$('refresh').onclick = () => { toast('Memuat ulang…', 1000); loadAll(); };
$('openSettings').onclick = () => { const c = cfg(); $('sUrl').value = c.url; $('sPin').value = c.pin; $('sGpt').value = store.get('gpt', ''); $('sPrompt').value = c.prompt; $('sAcc').value = c.acc; $('sTimes').value = c.times; $('sCapV').value = c.capV; $('sCapS').value = c.capS; $('settings').showModal(); };
$('closeSettings').onclick = () => $('settings').close();
$('resetPrompt').onclick = () => { $('sPrompt').value = DEFAULT_PROMPT; };
$('saveSettings').onclick = () => {
  store.set('url', $('sUrl').value.trim()); store.set('pin', $('sPin').value);
  store.set('gpt', $('sGpt').value.trim());
  store.set('acc', $('sAcc').value.trim()); store.set('times', $('sTimes').value.trim());
  store.set('capV', $('sCapV').value.trim() === DEF_CAPV ? '' : $('sCapV').value); store.set('capS', $('sCapS').value.trim() === DEF_CAPS ? '' : $('sCapS').value);
  store.set('prompt', $('sPrompt').value.trim() === DEFAULT_PROMPT.trim() ? '' : $('sPrompt').value);
  $('settings').close(); toast('Tersimpan'); loadAll();
};
loadAll();
setInterval(loadAll, 300000);
</script>
</body>
</html>
