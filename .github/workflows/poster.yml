name: Tarik pesanan dari Discord

on:
  schedule:
    - cron: "*/10 * * * *"   # cek Discord tiap 10 menit
  workflow_dispatch:          # tombol "Run workflow" untuk tarik sekarang

permissions:
  contents: write

concurrency:
  group: poster-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests pillow

      - name: Tarik pesanan
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python run.py

      - name: Simpan ke repo
        run: |
          git config user.name "ornakuy-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Pesanan baru dari Discord"
          git push
